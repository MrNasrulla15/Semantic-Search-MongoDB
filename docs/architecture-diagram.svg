<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460">
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 700 22px Arial, sans-serif; fill: #111827; }
      .label { font: 500 16px Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="30" y="40" class="title">Semantic Search MongoDB - Architecture</text>

  <rect x="30" y="90" width="220" height="110" class="box"/>
  <text x="50" y="130" class="label">React Frontend</text>
  <text x="50" y="158" class="small">SearchBar + Results</text>

  <rect x="310" y="90" width="250" height="110" class="box"/>
  <text x="330" y="130" class="label">Express Backend</text>
  <text x="330" y="158" class="small">/api/ingest, /api/search</text>

  <rect x="620" y="90" width="220" height="110" class="box"/>
  <text x="640" y="130" class="label">Embedding API</text>
  <text x="640" y="158" class="small">Google Gemini (768-D)</text>

  <rect x="870" y="90" width="200" height="110" class="box"/>
  <text x="890" y="130" class="label">MongoDB Atlas</text>
  <text x="890" y="158" class="small">Vector Search Index</text>

  <path d="M250 145 L310 145" class="arrow"/>
  <path d="M560 120 L620 120" class="arrow"/>
  <path d="M840 145 L870 145" class="arrow"/>

  <rect x="30" y="260" width="1040" height="160" class="box"/>
  <text x="50" y="295" class="label">Simple Flow</text>
  <text x="50" y="325" class="small">1) Insert sample documents into MongoDB with embedding vectors</text>
  <text x="50" y="350" class="small">2) User submits query in React UI</text>
  <text x="50" y="375" class="small">3) Backend creates query embedding and calls Atlas $vectorSearch</text>
  <text x="50" y="400" class="small">4) Backend returns top 5 results to React for display</text>
</svg>
